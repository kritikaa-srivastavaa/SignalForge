# Opt-in only: local application.properties and Compose remain unchanged.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
signalforge.frontend-origin=${SIGNALFORGE_FRONTEND_ORIGIN}
signalforge.public-url=${SIGNALFORGE_FRONTEND_ORIGIN}
spring.datasource.url=${CLOUD_DATABASE_JDBC_URL}
spring.datasource.username=${CLOUD_DATABASE_USERNAME}
spring.datasource.password=${CLOUD_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.jpa.show-sql=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.kafka.bootstrap-servers=${CLOUD_KAFKA_BOOTSTRAP_SERVERS}
# Aiven TLS client authentication. PEM values are provider secrets, not files in Git.
spring.kafka.properties[security.protocol]=SSL
spring.kafka.properties[ssl.truststore.type]=PEM
spring.kafka.properties[ssl.truststore.certificates]=${CLOUD_KAFKA_CA_CERT}
spring.kafka.properties[ssl.keystore.type]=PEM
spring.kafka.properties[ssl.keystore.certificate.chain]=${CLOUD_KAFKA_CLIENT_CERT}
spring.kafka.properties[ssl.keystore.key]=${CLOUD_KAFKA_CLIENT_KEY}
spring.kafka.properties[ssl.endpoint.identification.algorithm]=https
# Free-tier topics are pre-provisioned; do not require topic-create privileges at startup.
spring.kafka.admin.auto-create=false
signalforge.mail.enabled=false
