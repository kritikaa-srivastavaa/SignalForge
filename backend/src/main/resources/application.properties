spring.application.name=signalforge

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/signalforge
spring.datasource.username=signalforge
spring.datasource.password=signalforge

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Kafka (local Windows host)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Kafka consumer
spring.kafka.consumer.group-id=signalforge-event-processors
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.kritika.signalforge.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.kritika.signalforge.event.EventMessage
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus

# Process-local sessions; local HTTP uses non-Secure cookies. Enable Secure with HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.tracking-modes=cookie
# Keep request bodies and JDBC bind values out of logs.
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF